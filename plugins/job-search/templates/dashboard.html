<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Job Search Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ed;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --line: #e1e0d9;
  --line-strong: #c3c2b7;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --focus: #2a78d6;
  --bar-req: #256abf;
  --bar-opt: #9ec5f4;
  --spark: #2a78d6;
  --good: #006300;
  --good-wash: rgba(12, 163, 12, 0.12);
  --warn-ink: #8a5a00;
  --warn-wash: rgba(250, 178, 25, 0.20);
  --bad-ink: #a52a2a;
  --bad-wash: rgba(208, 59, 59, 0.12);
  --neutral-wash: rgba(11, 11, 11, 0.06);
  --violet-ink: #4f3fc0;
  --violet-wash: rgba(98, 80, 214, 0.12);
  --del-wash: rgba(208, 59, 59, 0.10);
  --ins-wash: rgba(12, 163, 12, 0.10);
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
  /* chart marks: categorical slots 1 to 3 (validated as a set), status marks */
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --mark-good: #0ca30c;
  --mark-bad: #d03b3b;
  --mark-warn: #fab219;
  --mark-muted: #c3c2b7;
  --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --line: #2c2c2a;
    --line-strong: #46463f;
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --accent-wash: rgba(57, 135, 229, 0.16);
    --focus: #86b6ef;
    --bar-req: #5598e7;
    --bar-opt: #1c5cab;
    --spark: #6da7ec;
    --good: #4cc44c;
    --good-wash: rgba(12, 163, 12, 0.20);
    --warn-ink: #fab219;
    --warn-wash: rgba(250, 178, 25, 0.16);
    --bad-ink: #f08080;
    --bad-wash: rgba(208, 59, 59, 0.22);
    --neutral-wash: rgba(255, 255, 255, 0.08);
    --violet-ink: #b3abf2;
    --violet-wash: rgba(144, 133, 233, 0.18);
    --del-wash: rgba(208, 59, 59, 0.20);
    --ins-wash: rgba(12, 163, 12, 0.18);
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --mark-muted: #57564f;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
a { color: var(--accent-ink); }
@media (prefers-color-scheme: dark) { a { color: var(--accent-ink); } }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 20px 0 8px; }
header.top h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
header.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
nav.tabs {
  display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line);
  margin-top: 12px; scrollbar-width: none;
}
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  appearance: none; border: 0; background: none; color: var(--ink-2);
  font: inherit; font-size: 14px; padding: 10px 12px; cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs .count {
  display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 9px;
  background: var(--warn-wash); color: var(--warn-ink); font-size: 12px; font-weight: 600; text-align: center;
}
main { padding: 20px 0 40px; }
section[role="tabpanel"][hidden] { display: none; }
h2 { font-size: 17px; margin: 24px 0 10px; font-weight: 650; }
h2:first-child { margin-top: 0; }
h3 { font-size: 15px; margin: 18px 0 8px; font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px;
}
.stack > * + * { margin-top: 12px; }
/* pipeline funnel */
.funnel { display: grid; grid-template-columns: 1.6fr repeat(6, minmax(0, 1fr)); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); }
.fstep { appearance: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; background: none; border: 0;
  border-left: 1px solid var(--line); padding: 10px 12px 10px 16px; position: relative; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fstep:first-child { border-left: 0; border-radius: var(--radius) 0 0 var(--radius); padding-left: 14px; }
.fstep:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.fstep + .fstep::before { content: ""; position: absolute; left: -5px; top: 50%; width: 8px; height: 8px; background: var(--surface);
  border-top: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); transform: translateY(-50%) rotate(45deg); }
.fstep:hover { background: var(--surface-2); }
.fstep:hover::before { background: var(--surface-2); }
.fstep[aria-pressed="true"] { background: var(--accent-wash); }
.fstep[aria-pressed="true"]::before { background: var(--surface); }
.fstep .fv { font-size: 24px; font-weight: 650; line-height: 1.1; }
.fstep .fk { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fstep .ftrack { height: 4px; border-radius: 2px; background: var(--accent-wash); margin-top: 6px; position: relative; }
.fstep .ffill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
.fstep.hot .fv { color: var(--warn-ink); }
.fstep .ftop { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.fstep .fspark { flex: none; }
@media (max-width: 760px) {
  .funnel { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .fstep:first-child { grid-column: span 2; }
  .fstep { padding: 8px 8px 8px 12px; }
  .fstep:nth-child(n+4) { border-top: 1px solid var(--line); }
  .fstep:nth-child(4) { border-left: 0; padding-left: 10px; }
  .fstep:nth-child(4)::before { display: none; }
  .fstep, .fstep:first-child, .fstep:last-child { border-radius: 0; }
  .fstep .fv { font-size: 20px; }
  .fstep .fk { font-size: 11.5px; white-space: normal; line-height: 1.25; }
}
/* small meters */
.smeter { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.smeter .trk { width: 36px; height: 6px; border-radius: 3px; background: var(--accent-wash); position: relative; flex: none; }
.smeter .fil { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.lv-lo { background: var(--mark-muted); }
.lv-ok { background: var(--accent); }
.lv-hi { background: var(--accent-ink); }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--accent-wash); }
.meter .fil { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.meter .mk { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink-2); border-radius: 1px; }
.meter-wrap { flex: 1 1 200px; min-width: 160px; }
.meter-scale { position: relative; height: 16px; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.meter-scale span { position: absolute; top: 0; white-space: nowrap; }
.split { display: flex; gap: 2px; height: 10px; margin: 10px 0 6px; }
.split span { display: block; height: 100%; min-width: 4px; }
.split span:first-child { border-radius: 4px 0 0 4px; }
.split span:last-child { border-radius: 0 4px 4px 0; }
.split span:only-child { border-radius: 4px; }
.k-good { background: var(--mark-good); }
.k-bad { background: var(--mark-bad); }
.k-none { background: var(--mark-muted); }
.k-warn { background: var(--mark-warn); }
.keyline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.keyline i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.keyline i.ring { background: none; border: 1.5px solid var(--line-strong); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid transparent;
  background: var(--neutral-wash); color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; line-height: 1.4; }
.tag.ok { background: var(--good-wash); color: var(--ink); }
.tag.ok.partial { background: none; border-color: var(--good); }
.tag.req { background: var(--bad-wash); color: var(--ink); }
.tag.opt { background: none; border-color: var(--line-strong); }
a.tag { text-decoration: none; }
a.tag:hover { border-color: var(--accent); }
.rw { display: inline-flex; align-items: center; gap: 8px; }
.rw .trk { width: 72px; height: 6px; border-radius: 3px; background: var(--neutral-wash); position: relative; }
.rw .fil { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.rw .mk { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink-2); }
.subhead { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 12px 0 0; }
.more > summary { font-size: 13px; margin-top: 4px; }
.more { margin-top: 8px; }
/* status history */
.htl { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; row-gap: 12px; }
.htl li { position: relative; padding: 18px 14px 0 0; min-width: 88px; font-size: 12.5px; line-height: 1.3; }
.htl li::before { content: ""; position: absolute; left: 0; top: 2px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--mark-muted); box-shadow: 0 0 0 2px var(--surface); z-index: 1; }
.htl li::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--line); }
.htl li:last-child::after { right: auto; width: 0; }
.htl li:last-child::before { background: var(--accent); }
.htl .st { font-weight: 600; display: block; }
.htl .dt { color: var(--muted); }
.htl .nt { display: block; color: var(--ink-2); max-width: 160px; overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 10px; }
input[type="search"], input[type="text"] {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px; min-width: 0;
}
input[type="search"] { flex: 1 1 220px; max-width: 360px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 3px 10px;
}
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip .n { color: var(--muted); margin-left: 4px; font-weight: 400; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
th button { appearance: none; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 0; }
th button::after { content: ""; margin-left: 4px; color: var(--muted); }
th[aria-sort="ascending"] button::after { content: "\2191"; }
th[aria-sort="descending"] button::after { content: "\2193"; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-wash); }
tbody tr.selected { background: var(--accent-wash); }
.nowrap { white-space: nowrap; }
.role-btn {
  appearance: none; border: 0; background: none; padding: 0; font: inherit; color: var(--ink);
  font-weight: 600; text-align: left; cursor: pointer;
}
.role-btn:hover { text-decoration: underline; }
.links { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  white-space: nowrap; background: var(--neutral-wash); color: var(--ink-2);
}
.b-blue { background: var(--accent-wash); color: var(--accent-ink); }
.b-amber { background: var(--warn-wash); color: var(--warn-ink); }
.b-green { background: var(--good-wash); color: var(--good); }
.b-red { background: var(--bad-wash); color: var(--bad-ink); }
.b-violet { background: var(--violet-wash); color: var(--violet-ink); }
.score { font-variant-numeric: tabular-nums; font-weight: 600; }
.btn {
  appearance: none; font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 6px;
  padding: 6px 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad-ink); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.ask { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.ask input { flex: 1 1 200px; }
.ask label { width: 100%; font-size: 13px; color: var(--ink-2); }
.empty {
  border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 28px 16px;
  text-align: center; color: var(--ink-2); background: var(--surface);
}
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; font-size: 15px; }
.empty code { font-family: var(--mono); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain > li { padding: 6px 0; border-bottom: 1px solid var(--line); }
ul.plain > li:last-child { border-bottom: 0; }
ul.plain.card { padding: 4px 16px; }
.table-scroll table.jobs { min-width: 860px; }
.ids { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 4px; }
.id { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink-2); }
.diff { display: grid; gap: 4px; margin-top: 6px; }
.diff div { padding: 6px 8px; border-radius: 6px; font-size: 13.5px; overflow-wrap: anywhere; }
.diff .del { background: var(--del-wash); }
.diff .ins { background: var(--ins-wash); }
.diff .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-right: 6px; }
.issues li { color: var(--bad-ink); }
/* detail panel */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 20; }
.scrim[hidden] { display: none; }
aside.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); z-index: 21;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  overflow-y: auto; overscroll-behavior: contain;
}
aside.panel[hidden] { display: none; }
.panel-head {
  position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; z-index: 1;
}
.panel-head .t { flex: 1; min-width: 0; }
.panel-head h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
.panel-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13.5px; }
.panel-body { padding: 4px 16px 32px; }
.panel-body h3 { border-top: 1px solid var(--line); padding-top: 14px; }
.close {
  appearance: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 6px; width: 34px; height: 34px; font-size: 20px; line-height: 1; cursor: pointer; flex: none;
}
.bigscore { font-size: 34px; font-weight: 650; line-height: 1; }
.bigscore span { font-size: 15px; color: var(--muted); font-weight: 400; }
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
/* gaps */
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 4px 0 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.gap-list { list-style: none; margin: 0; padding: 0; }
.gap {
  display: grid; grid-template-columns: 28px minmax(0, 1.2fr) minmax(0, 2fr) 104px; gap: 12px;
  align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line);
}
.gap:last-child { border-bottom: 0; }
.gap .rank { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.gap .name { font-weight: 600; overflow-wrap: anywhere; }
.gap .sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.bar-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar-track { flex: 1; min-width: 40px; height: 14px; position: relative; }
.bar { position: absolute; left: 0; top: 0; bottom: 0; display: flex; gap: 2px; }
.bar span { display: block; height: 100%; min-width: 0; }
.bar span:first-child { border-radius: 0; }
.bar span:last-child { border-radius: 0 4px 4px 0; }
.bar .req { background: var(--bar-req); }
.bar .opt { background: var(--bar-opt); }
.bar-val { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.spark { display: block; }
.spark-cell { font-size: 11.5px; color: var(--muted); text-align: right; }
.gap-actions { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gap-note { font-size: 13px; color: var(--ink-2); }
@media (max-width: 640px) {
  .gap { grid-template-columns: 24px minmax(0, 1fr) 84px; }
  .gap .bar-wrap { grid-column: 2 / -1; grid-row: 2; }
  .gap .spark-cell { grid-column: 3; grid-row: 1; }
  .gap-actions { grid-column: 2 / -1; }
}
/* career radar */
.verdict { font-size: 16px; font-weight: 600; line-height: 1.45; }
/* radar report rendered from markdown */
.md-sec { margin-top: 14px; padding: 0; overflow: hidden; scroll-margin-top: 12px; }
.md-sec > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
.md-sec > summary::-webkit-details-marker { display: none; }
.md-sec > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.md-sec[open] > summary::before { transform: rotate(45deg); }
.md-sec > summary h2 { margin: 0; font-size: 16px; }
.md-sec.lead { border-color: var(--accent); }
.md-sec.lead > summary { background: var(--accent-wash); }
.md-body { padding: 4px 16px 14px; line-height: 1.55; font-size: 14px; }
.md-body > :first-child { margin-top: 6px; }
.md-body h3 { font-size: 14.5px; margin: 16px 0 6px; }
.md-body h4 { font-size: 13.5px; margin: 12px 0 4px; color: var(--ink-2); }
.md-body p { margin: 8px 0; }
.md-body ul, .md-body ol { margin: 6px 0; padding-left: 22px; }
.md-body li { margin: 3px 0; }
.md-body li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; align-items: flex-start; }
.md-body li.task input { margin-top: 4px; flex: none; }
.md-body code { font-family: var(--mono); font-size: 12.5px; background: var(--neutral-wash); padding: 1px 5px; border-radius: 4px; }
.md-body pre { background: var(--neutral-wash); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.md-body pre code { background: none; padding: 0; }

    if (retired.length) {

        h("ul", { class: "plain", style: "margin-top:8px" }, retired.map(function (l) {
          return h("li", null, h("div", { class: "muted" }, l.text || ""), h("div", { class: "meta" }, h("span", null, l.id), h("span", null, "Scope: " + (l.scope || "all"))));
        }))));
    }
    if (decided.length) {
      root.appendChild(h("details", null, h("summary", null, "Answered suggestions (" + decided.length + ")"),
        h("ul", { class: "plain", style: "margin-top:8px" }, decided.map(function (p) {
          return h("li", null, h("div", null, p.text || ""), h("div", { class: "meta" }, h("span", null, p.id), h("span", null, p.status || "")));
        }))));
    }

    var sc = DATA.signal_counts || {};
    var keys = Object.keys(sc);
    root.appendChild(h("h2", null, "Signals recorded"));
    if (!keys.length) root.appendChild(h("p", { class: "muted small" }, "No signals yet. Edits, rejections and dismissals are logged as you use the plugin."));
    else root.appendChild(h("div", { class: "chips", "aria-label": "Signal counts by type" }, keys.map(function (k) {
      return h("span", { class: "badge" }, k.replace(/_/g, " ") + ": " + sc[k]);
    })));
  }

  // ---------- runs ----------
  var RUN_SERIES = [["new", "New", "c-s1"], ["scored", "Scored", "c-s2"], ["prepared", "Prepared", "c-s3"]];
  function runErrors(r) { return Array.isArray(r.errors) ? r.errors : (r.errors ? [String(r.errors)] : []); }
  // Grouped columns for the last runs, oldest on the left. A red dot marks a run with errors.
  function runsChart(runs) {
    var list = runs.slice(0, 21).reverse();
    var max = 1;
    list.forEach(function (r) { RUN_SERIES.forEach(function (s) { max = Math.max(max, Number(r[s[0]]) || 0); }); });
    var plot = h("div", { class: "rc-plot", role: "group", "aria-label": "Last " + plural(list.length, "run") + ": new, scored and prepared jobs per run" },
      h("div", { class: "rc-grid", "aria-hidden": "true" }, h("span", { class: "rc-max" }, String(max))));
    list.forEach(function (r) {
      var errs = runErrors(r);
      var text = fmtDateTime(r.ts) + ": " + RUN_SERIES.map(function (s) { return (Number(r[s[0]]) || 0) + " " + s[1].toLowerCase(); }).join(", ") +
        (errs.length ? ", " + plural(errs.length, "error") : "");
      var g = h("div", { class: "rc-g", tabindex: "0", role: "img", "aria-label": text });
      RUN_SERIES.forEach(function (s) {
        var v = Number(r[s[0]]) || 0;
        var bar = h("span", { class: s[2] });
        bar.style.height = (v / max * 100).toFixed(1) + "%";
        if (v) bar.style.minHeight = "2px";
        g.appendChild(bar);
      });
      if (errs.length) g.appendChild(h("i", { class: "e", "aria-hidden": "true" }));
      bindTip(g, function () {
        return [h("strong", null, fmtDateTime(r.ts)), h("div", null, (r.kind || "run")),
          RUN_SERIES.map(function (s) { return h("div", null, (Number(r[s[0]]) || 0) + " " + s[1].toLowerCase()); }),
          errs.length ? h("div", null, plural(errs.length, "error") + ": " + errs.join("; ")) : null];
      });
      plot.appendChild(g);
    });
    return h("div", { class: "card runs-chart" },
      h("div", { class: "keyline", "aria-hidden": "true" },
        RUN_SERIES.map(function (s) { return h("span", null, h("i", { class: s[2] }), s[1]); }),
        h("span", null, h("i", { class: "k-bad", style: "border-radius:50%" }), "Errors")),
      plot,
      h("div", { class: "rc-x", "aria-hidden": "true" }, h("span", null, fmtDate(list[0].ts)), h("span", null, fmtDate(list[list.length - 1].ts))));
  }
  function renderRuns(root) {
    clear(root);
    var runs = DATA.runs || [];
    root.appendChild(h("h2", null, "Runs"));
    if (!runs.length) {
      root.appendChild(empty("No runs yet.", "Each /job-search:run adds a row here. Set up a daily scheduled task to keep it fresh."));
      return;
    }
    var withErr = runs.filter(function (r) { return runErrors(r).length && daysAgo(r.ts) <= 7; }).length;
    root.appendChild(h("p", { class: "muted small", style: "margin:0 0 10px" }, "Last run " + fmtDateTime(runs[0].ts) + ". " +
      (withErr ? plural(withErr, "run") + " with errors this week." : "No errors this week.")));
    root.appendChild(runsChart(runs));
    var cols = ["Time", "Kind", "Found", "New", "Scored", "Prepared", "Needs approval", "Errors"];
    var tbody = h("tbody", null, runs.map(function (r) {
      var errs = runErrors(r);
      return h("tr", null,
        h("td", { class: "nowrap" }, fmtDateTime(r.ts)),
        h("td", null, h("span", { class: "badge " + (r.kind === "weekly" ? "b-violet" : "") }, r.kind || "")),
        ["found", "new", "scored", "prepared", "needs_approval"].map(function (k) { return h("td", { class: "num" }, r[k] == null ? "" : String(r[k])); }),
        h("td", null, errs.length ? h("ul", { class: "errors" }, errs.map(function (e) { return h("li", null, String(e)); })) : h("span", { class: "muted" }, "None"),
          r.notes ? h("div", { class: "small muted" }, r.notes) : null));
    }));
    var wide = false;
    try { wide = window.matchMedia("(min-width: 900px)").matches; } catch (e) { wide = false; }
    root.appendChild(h("details", { open: wide }, h("summary", null, "All runs (" + runs.length + ")"),
      h("div", { class: "table-scroll", style: "margin-top:8px" }, h("table", { class: "jobs", "aria-label": "Run log" },
        h("thead", null, h("tr", null, cols.map(function (c, i) { return h("th", { scope: "col", class: i >= 2 && i <= 6 ? "num" : null }, c); }))), tbody))));
  }

  // ---------- header + footer ----------
  function renderChrome() {
    var sub = document.getElementById("subtitle");
    var n = JOBS.length;
    sub.textContent = n ? plural(n, "job") + " tracked. Updated " + fmtDateTime(DATA.generated_at) + "." : "Updated " + fmtDateTime(DATA.generated_at) + ".";
    var f = document.getElementById("footer");
    clear(f);
    f.appendChild(h("p", null, "Generated " + fmtDateTime(DATA.generated_at) + " (" + (DATA.generated_at || "") + ")"));
    f.appendChild(h("p", null, "Data folder: ", h("code", null, DATA.home || "")));
    f.appendChild(h("p", null, "This page is a snapshot. To refresh it, run ", h("code", null, "/job-search:dashboard"), " in Claude, then reload."));
    if (DATA.error) f.appendChild(h("p", { style: "color:var(--bad-ink)" }, "Could not read dashboard data: " + DATA.error));
  }

  renderChrome();
  setupTabs();
})();
</script>
</body>
</html>
