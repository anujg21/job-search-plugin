<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  @page { size: Letter; margin: 0.5in 0.6in; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0 auto; max-width: 7.3in; padding: 0.4in 0;
    font-family: Arial, Helvetica, "Liberation Sans", sans-serif;
    font-size: 10.5pt; line-height: 1.35; color: #111; background: #fff;
  }
  @media print { body { padding: 0; max-width: none; } }
  header { margin-bottom: 8pt; }
  h1 { font-size: 18pt; margin: 0; letter-spacing: 0.2pt; }
  .headline { font-size: 11.5pt; font-weight: bold; color: #333; margin: 2pt 0 3pt; }
  .contact { font-size: 9.5pt; color: #333; margin: 0; }
  .contact a { color: #333; text-decoration: none; }
  h2 {
    font-size: 10.5pt; text-transform: uppercase; letter-spacing: 0.8pt;
    border-bottom: 1px solid #999; margin: 10pt 0 4pt; padding-bottom: 1pt;
  }
  p { margin: 0 0 4pt; }
  .role { margin: 0 0 6pt; break-inside: avoid-page; page-break-inside: avoid; }
  .role-head { font-weight: bold; margin: 0; }
  .role-meta { color: #333; font-size: 9.5pt; margin: 0 0 2pt; }
  ul { margin: 2pt 0 0 0; padding-left: 14pt; }
  li { margin: 0 0 2pt; }
  .item { margin: 0 0 3pt; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
